spring:
  application:
    name: auth-service
  profiles:
    active: default
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
    driver-class-name: org.postgresql.Driver
    username: ${AUTH_DB_USERNAME:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
logging:
  level:
    root: INFO
server:
  port: 8080
auth:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:}
    realm: ${KEYCLOAK_REALM:}
    client-id: ${KEYCLOAK_CLIENT_ID:}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
---
# Common configuration for all profiles.
# Use application-<profile>.yml for environment-specific overrides.
