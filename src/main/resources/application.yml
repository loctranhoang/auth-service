spring:
  application:
    name: auth-service
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
logging:
  level:
    root: INFO
server:
  port: 8080
---
# Common configuration for all profiles.
# Use application-<profile>.yml for environment-specific overrides.
