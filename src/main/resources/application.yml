spring:
  application:
    name: auth-service
  profiles:
    active: default
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
    driver-class-name: org.postgresql.Driver
    username: ${AUTH_DB_USERNAME:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
logging:
  level:
    root: INFO
server:
  port: 8080
auth:
  keycloak:
    server-url: ${AUTH_KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${AUTH_KEYCLOAK_REALM:auth}
    client-id: ${AUTH_KEYCLOAK_CLIENT_ID:auth-service}
    client-secret: ${AUTH_KEYCLOAK_CLIENT_SECRET:}
    admin-realm: ${AUTH_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${AUTH_KEYCLOAK_ADMIN_CLIENT_ID:auth-service-admin}
    admin-client-secret: ${AUTH_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${AUTH_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:}
---
# Common configuration for all profiles.
# Use application-<profile>.yml for environment-specific overrides.
