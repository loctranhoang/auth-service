spring:
  datasource:
    url: jdbc:postgresql://staging-db.example.com:5432/authdb
    username: staginguser
    password: stagingpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
server:
  port: 8083
logging:
  level:
    root: WARN
    org.springframework: INFO
