spring:
  datasource:
    url: jdbc:postgresql://staging-db-host:5432/authdb_staging
    username: staging_user
    password: staging_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  profiles:
    active: staging
server:
  port: 8082
logging:
  level:
    root: WARN
  file:
    name: logs/auth-service-staging.log