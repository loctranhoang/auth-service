spring:
  datasource:
    url: jdbc:postgresql://staging-db:5432/authdb
    username: staginguser
    password: stagingpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  profiles:
    active: staging
server:
  port: 8082
logging:
  level:
    root: INFO
    com.az.auth: INFO