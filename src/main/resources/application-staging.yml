spring:
  profiles: staging
  datasource:
    url: jdbc:postgresql://staging-db.example.com:5432/auth_staging
    driver-class-name: org.postgresql.Driver
    username: staginguser
    password: stagingpassword
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
server:
  port: 8082
logging:
  level:
    root: WARN
