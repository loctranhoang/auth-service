spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://staging-db-server:5432/authdb_staging
    username: staging_user
    password: staging_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  port: 8082
logging:
  level:
    org.springframework: WARN
    com.az.auth: INFO
---
# Configure environment variables and sensitive property loading for staging
