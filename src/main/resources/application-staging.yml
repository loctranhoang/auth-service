spring:
  profiles: staging
  datasource:
    url: jdbc:postgresql://staging-db-server:5432/auth_staging
    username: staging_user
    password: staging_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  port: 8082
auth:
  jwt:
    secret: staging-secret-key
    expiration: 86400
logging:
  level:
    root: WARN
