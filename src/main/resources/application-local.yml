spring:
  profiles: local
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_local
    username: local_user
    password: local_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
auth:
  jwt:
    secret: dev-secret-key-local
    expiration: 86400
logging:
  level:
    root: DEBUG
