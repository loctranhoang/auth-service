spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: localuser
    password: localpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: local
server:
  port: 8080
logging:
  level:
    root: DEBUG
    com.az.auth: DEBUG