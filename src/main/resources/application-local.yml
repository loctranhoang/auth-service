spring:
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
server:
  port: 8080
logging:
  level:
    root: DEBUG
    com.az.auth: DEBUG
