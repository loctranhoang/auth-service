spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/platform}
    driver-class-name: org.postgresql.Driver
    username: ${AUTH_DB_USERNAME:}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
server:
  port: ${SERVER_PORT:8081}
logging:
  level:
    org.springframework: DEBUG
    com.az.auth: DEBUG
auth:
  keycloak:
    server-url: ${AUTH_KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${AUTH_KEYCLOAK_REALM:az}
    client-id: ${AUTH_KEYCLOAK_CLIENT_ID:auth-service}
    client-secret: ${AUTH_KEYCLOAK_CLIENT_SECRET:}
    admin-realm: ${AUTH_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${AUTH_KEYCLOAK_ADMIN_CLIENT_ID:auth-service-admin}
    admin-client-secret: ${AUTH_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${AUTH_KEYCLOAK_ADMIN_USERNAME:}
    admin-password: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:}
---
# Add environment-specific values and secrets only for local use
