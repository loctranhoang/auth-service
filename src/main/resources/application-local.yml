spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb_local
    username: local_user
    password: local_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: local
server:
  port: 8080
logging:
  level:
    root: DEBUG
  file:
    name: logs/auth-service-local.log