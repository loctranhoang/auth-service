spring:
  profiles: local
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  server:
    port: 8080
logging:
  level:
    org.springframework: DEBUG
    com.az.auth: DEBUG
---
# Add environment-specific values and secrets only for local use
