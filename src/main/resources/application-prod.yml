spring:
  datasource:
    url: jdbc:postgresql://prod-db.example.com:5432/authdb
    username: produser
    password: strong-production-password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
server:
  port: 8080
logging:
  level:
    root: ERROR
    org.springframework: WARN
