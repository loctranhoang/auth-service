spring:
  datasource:
    url: jdbc:postgresql://prod-db:5432/authdb
    username: produser
    password: prodpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  profiles:
    active: prod
server:
  port: 80
logging:
  level:
    root: WARN
    com.az.auth: INFO