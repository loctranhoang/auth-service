spring:
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/auth_db
    driver-class-name: org.postgresql.Driver
    username: prod_user
    password: prod_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  port: 8080
logging:
  level:
    root: WARN
    org.springframework: ERROR
