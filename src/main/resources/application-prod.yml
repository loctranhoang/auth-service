spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/authdb_prod
    username: prod_user
    password: prod_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  port: 8083
logging:
  level:
    org.springframework: ERROR
    com.az.auth: WARN
---
# Production secrets and credentials should be sourced via environment variables or secret management
