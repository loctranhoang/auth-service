spring:
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/auth_db_prod
    username: prod_user
    password: prod_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  profiles:
    active: prod
---
logging:
  level:
    root: ERROR
    org.springframework: ERROR
---
server:
  port: 8083