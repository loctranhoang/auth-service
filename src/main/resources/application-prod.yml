spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/authdb_prod
    username: prod_user
    password: prod_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  profiles:
    active: prod
server:
  port: 8083
logging:
  level:
    root: ERROR
  file:
    name: logs/auth-service-prod.log