spring:
  profiles: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db_dev
    driver-class-name: org.postgresql.Driver
    username: auth_user
    password: dev_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081
auth:
  jwt:
    secret: dev-secret-key
    expiration: 3600