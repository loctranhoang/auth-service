spring:
  profiles: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_dev_db
    driver-class-name: org.postgresql.Driver
    username: dev_user
    password: dev_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: INFO
server:
  port: 8080
