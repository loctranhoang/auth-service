spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://dev-db.example.com:5432/authdb_dev
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    serialization:
      INDENT_OUTPUT: true
server:
  port: 8081
logging:
  level:
    org.springframework: INFO
    com.az.auth: DEBUG
feature-flags:
  enable-experimental-auth-flow: true
external-services:
  user-service-url: https://dev-users.example.com
  mail-service-url: https://dev-mail.example.com
---
# Development profile configuration
# Note: Do not include secrets or production endpoints here.
