spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb_dev
    driver-class-name: org.postgresql.Driver
    username: dev_user
    password: dev_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
logging:
  level:
    root: INFO
    com.az.auth: DEBUG
