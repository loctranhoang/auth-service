spring:
  datasource:
    url: jdbc:postgresql://dev-db-host:5432/authdb_dev
    username: dev_user
    password: dev_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  profiles:
    active: dev
server:
  port: 8081
logging:
  level:
    root: INFO
  file:
    name: logs/auth-service-dev.log