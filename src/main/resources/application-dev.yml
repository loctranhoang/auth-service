spring:
  datasource:
    url: jdbc:postgresql://dev-db:5432/authdb
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
server:
  port: 8081
logging:
  level:
    root: INFO
    com.az.auth: DEBUG