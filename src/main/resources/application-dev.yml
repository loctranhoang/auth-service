spring:
  profiles: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_dev
    driver-class-name: org.postgresql.Driver
    username: devuser
    password: devpassword
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081
logging:
  level:
    root: INFO
