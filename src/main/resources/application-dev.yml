spring:
  datasource:
    url: jdbc:postgresql://dev-db-server:5432/auth_db_dev
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
---
logging:
  level:
    root: INFO
    org.springframework: INFO
---
server:
  port: 8081