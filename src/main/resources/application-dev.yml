spring:
  datasource:
    url: jdbc:postgresql://dev-db.example.com:5432/authdb
    username: devuser
    password: devpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8082
logging:
  level:
    root: INFO
    org.springframework: DEBUG
