name: CI

on:
  push:
    branches:
      - dev
      - main
      - "feature/**"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest

    outputs:
      artifact_id: ${{ steps.maven-metadata.outputs.artifact_id }}
      version: ${{ steps.maven-metadata.outputs.version }}
      jar_path: ${{ steps.maven-metadata.outputs.jar_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read Maven project metadata
        id: maven-metadata
        shell: bash
        run: |
          artifact_id="$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)"
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          final_name="$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)"

          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "jar_path=target/${final_name}.jar" >> "$GITHUB_OUTPUT"

      - name: Run Maven tests
        run: mvn -B test

      - name: Package application
        run: mvn -B -DskipTests package

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.maven-metadata.outputs.artifact_id }}-${{ steps.maven-metadata.outputs.version }}
          path: ${{ steps.maven-metadata.outputs.jar_path }}
          if-no-files-found: error

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-package.outputs.artifact_id }}-${{ needs.build-test-package.outputs.version }}
          path: target

      - name: Validate Docker image build
        run: docker build --build-arg JAR_FILE=${{ needs.build-test-package.outputs.jar_path }} -t ${{ needs.build-test-package.outputs.artifact_id }}:${{ github.sha }} .
