name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run Flyway migrations before deployment"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build_and_publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image-metadata.outputs.image_name }}
      image_tag: ${{ steps.image-metadata.outputs.image_tag }}
      image_ref: ${{ steps.image-metadata.outputs.image_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read Maven project metadata
        id: maven-metadata
        shell: bash
        run: |
          artifact_id="$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)"
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          final_name="$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)"

          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "jar_path=target/${final_name}.jar" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: image-metadata
        shell: bash
        run: |
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          image_tag="${GITHUB_SHA}"

          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_name}:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Run Maven tests
        run: mvn -B test

      - name: Package application
        run: mvn -B -DskipTests package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg JAR_FILE=${{ steps.maven-metadata.outputs.jar_path }} \
            -t ${{ steps.image-metadata.outputs.image_ref }} \
            -t ${{ steps.image-metadata.outputs.image_name }}:${{ steps.maven-metadata.outputs.version }} \
            -t ${{ steps.image-metadata.outputs.image_name }}:latest \
            .

      - name: Publish Docker image
        run: |
          docker push ${{ steps.image-metadata.outputs.image_ref }}
          docker push ${{ steps.image-metadata.outputs.image_name }}:${{ steps.maven-metadata.outputs.version }}
          docker push ${{ steps.image-metadata.outputs.image_name }}:latest

  migrate_production:
    name: Run production migrations
    runs-on: ubuntu-latest
    needs: build_and_publish
    if: ${{ inputs.run_migrations == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Flyway migrations
        shell: bash
        env:
          FLYWAY_URL: ${{ secrets.PROD_DB_URL }}
          FLYWAY_USER: ${{ secrets.PROD_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          if [ ! -d src/main/resources/db/migration ]; then
            echo "No Flyway migration directory found; skipping migrations."
            exit 0
          fi

          docker run --rm \
            -v "$PWD/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -url="${FLYWAY_URL}" \
            -user="${FLYWAY_USER}" \
            -password="${FLYWAY_PASSWORD}" \
            migrate

  deploy_production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - build_and_publish
      - migrate_production
    if: ${{ always() && needs.build_and_publish.result == 'success' && (needs.migrate_production.result == 'success' || needs.migrate_production.result == 'skipped') }}
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy container
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          IMAGE_REF: ${{ needs.build_and_publish.outputs.image_ref }}
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "echo '${GITHUB_TOKEN}' | docker login ${REGISTRY} -u '${GITHUB_ACTOR}' --password-stdin && \
             docker pull '${IMAGE_REF}' && \
             docker stop auth-service || true && \
             docker rm auth-service || true && \
             docker run -d \
               --name auth-service \
               --restart unless-stopped \
               -p 8080:8080 \
               '${IMAGE_REF}'"
