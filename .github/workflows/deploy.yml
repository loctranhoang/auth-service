name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy. Defaults to sha-<current commit>.
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
      - main
    types:
      - completed

permissions:
  contents: read
  packages: read

concurrency:
  group: auth-service-kubernetes-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: auth-service
  DEPLOYMENT_NAME: auth-service
  CONTAINER_NAME: auth-service

jobs:
  deploy:
    name: Deploy auth-service to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deployment image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${{ github.event.inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              image_tag="sha-${{ github.event.workflow_run.head_sha }}"
            else
              image_tag="sha-${GITHUB_SHA}"
            fi
          fi

          repository="${GITHUB_REPOSITORY,,}"
          image_ref="${REGISTRY}/${repository}:${image_tag}"

          {
            echo "image_tag=${image_tag}"
            echo "image_ref=${image_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.kube"
          kubeconfig="$HOME/.kube/config"

          if [ -n "$KUBE_CONFIG_DATA" ]; then
            printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$kubeconfig"
          elif [ -n "$KUBE_CONFIG" ]; then
            printf '%s' "$KUBE_CONFIG" > "$kubeconfig"
          else
            echo "Configure either KUBE_CONFIG_DATA or KUBE_CONFIG as a GitHub secret." >&2
            exit 1
          fi

          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Update deployment image
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl --namespace "$NAMESPACE" set image \
            "deployment/$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$IMAGE_REF"

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl --namespace "$NAMESPACE" rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            --timeout=180s

          deployed_image="$(kubectl --namespace "$NAMESPACE" get deployment "$DEPLOYMENT_NAME" \
            -o jsonpath="{.spec.template.spec.containers[?(@.name=='$CONTAINER_NAME')].image}")"

          if [ "$deployed_image" != "${{ steps.image.outputs.image_ref }}" ]; then
            echo "Expected image ${{ steps.image.outputs.image_ref }}, found $deployed_image." >&2
            exit 1
          fi
