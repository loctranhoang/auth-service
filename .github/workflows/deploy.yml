name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

env:
  IMAGE_NAME: auth-service

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --build-arg JAR_FILE=target/auth-service.jar -t $IMAGE_NAME:${{ github.sha }} .
      - name: Push Docker image
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:${{ github.event.inputs.environment || 'dev' }}
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:${{ github.event.inputs.environment || 'dev' }}
      - name: Deploy to environment
        if: ${{ github.event.inputs.environment == 'production' }}
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          echo "Deploying to production..."
          # Add production deployment steps here (e.g., kubectl apply ...)
      - name: Deploy to environment
        if: ${{ github.event.inputs.environment == 'staging' }}
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          echo "Deploying to staging..."
          # Add staging deployment steps here (e.g., kubectl apply ...)
      - name: Deploy to environment
        if: ${{ github.event.inputs.environment == 'dev' }}
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DEV }}
        run: |
          echo "Deploying to dev..."
          # Add dev deployment steps here (e.g., kubectl apply ...)
