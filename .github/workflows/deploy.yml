name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy. Defaults to the current commit SHA.
        required: false
        type: string
      run_migrations:
        description: Run Flyway migrations before deployment.
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/deploy.yml"
      - "k8s/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

      - name: Package application
        run: mvn -B -DskipTests package

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          requested_tag="${{ github.event.inputs.image_tag }}"
          image_tag="${requested_tag:-$DEFAULT_IMAGE_TAG}"
          image_ref="$REGISTRY/${IMAGE_NAME,,}:$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JAR_FILE=target/auth-service.jar
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest

  migrate-production:
    name: Run production migrations
    runs-on: ubuntu-latest
    needs: build-and-publish
    environment: production
    if: ${{ github.event_name == 'push' || github.event.inputs.run_migrations == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Flyway migrations
        env:
          FLYWAY_URL: ${{ secrets.PROD_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.PROD_FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.PROD_FLYWAY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="src/main/resources/db/migration"

          if [ ! -d "$migration_dir" ]; then
            echo "No Flyway migration directory found at $migration_dir; skipping migration."
            exit 0
          fi

          docker run --rm \
            -v "$PWD/$migration_dir:/flyway/sql:ro" \
            flyway/flyway:10 \
            -url="$FLYWAY_URL" \
            -user="$FLYWAY_USER" \
            -password="$FLYWAY_PASSWORD" \
            migrate

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - build-and-publish
      - migrate-production
    if: ${{ always() && needs.build-and-publish.result == 'success' && (needs.migrate-production.result == 'success' || needs.migrate-production.result == 'skipped') }}
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.kube
          printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update deployment image
        shell: bash
        run: |
          set -euo pipefail
          kubectl set image deployment/auth-service \
            auth-service=${{ needs.build-and-publish.outputs.image_ref }} \
            -n auth-service

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/auth-service \
            -n auth-service \
            --timeout=5m
