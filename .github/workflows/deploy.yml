name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy. Defaults to sha-<current commit SHA>.
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: auth-service-kubernetes-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auth-service
  NAMESPACE: auth-service
  DEPLOYMENT_NAME: auth-service
  CONTAINER_NAME: auth-service
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  KUBE_CONFIG_PATH: ${{ runner.temp }}/kubeconfig

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG}" ]; then
            echo "KUBE_CONFIG secret is required."
            exit 1
          fi

          printf '%s' "${KUBE_CONFIG}" > "${KUBE_CONFIG_PATH}"
          chmod 600 "${KUBE_CONFIG_PATH}"

      - name: Resolve image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          requested_tag="${{ github.event.inputs.image_tag }}"
          default_tag="sha-${DEPLOY_SHA}"
          image_tag="${requested_tag:-$default_tag}"
          image_ref="${REGISTRY}/${owner}/${IMAGE_NAME}:${image_tag}"

          {
            echo "tag=${image_tag}"
            echo "ref=${image_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply Kubernetes manifests
        env:
          KUBECONFIG: ${{ env.KUBE_CONFIG_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Update deployment image
        env:
          KUBECONFIG: ${{ env.KUBE_CONFIG_PATH }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "${NAMESPACE}" set image \
            "deployment/${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}=${IMAGE_REF}"

      - name: Verify rollout
        env:
          KUBECONFIG: ${{ env.KUBE_CONFIG_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "${NAMESPACE}" rollout status \
            "deployment/${DEPLOYMENT_NAME}" \
            --timeout=180s
